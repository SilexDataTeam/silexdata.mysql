# SPDX-License-Identifier: Apache-2.0
# Check-mode tests for the inventory plugin.
#
# An inventory plugin only reads, so a playbook run with --check must see the
# same inventory, and report no changes, exactly as a normal run would. These
# are NOT conditional on any declared check-mode support: if the plugin ever
# behaves differently under --check, they fail by design.

- name: Check-mode | Write a playbook that visits every inventory host
  ansible.builtin.copy:
    dest: "{{ inventory_workdir.path }}/visit-hosts.yml"
    content: |
      ---
      - name: Visit every host the inventory produced
        hosts: all
        gather_facts: false
        tasks:
          - name: Report the host
            ansible.builtin.debug:
              var: inventory_hostname
    mode: "0600"

- name: Check-mode | Write a source that omits the required db_query
  ansible.builtin.copy:
    dest: "{{ inventory_workdir.path }}/check-no-query.mysql.yml"
    content: |
      ---
      plugin: silexdata.mysql.inventory
      db_host: {{ inventory_unreachable_db_host }}
      db_user: dry-run-user
      db_password: dry-run-password
      db_name: dry_run
    mode: "0600"

- name: Check-mode | Run the playbook in check mode against the invalid source
  ansible.builtin.command:
    argv: >-
      {{ inventory_clean_env + ['ansible-playbook', '--check',
      '-i', inventory_workdir.path ~ '/check-no-query.mysql.yml',
      inventory_workdir.path ~ '/visit-hosts.yml'] }}
  environment: "{{ inventory_env }}"
  register: inventory_check_no_query
  changed_when: false
  failed_when: false

- name: Check-mode | Assert check mode does not bypass the plugin's validation
  ansible.builtin.assert:
    that:
      - inventory_check_no_query.rc != 0
      - "'db_query' in (inventory_check_no_query.stdout ~ inventory_check_no_query.stderr)"
    fail_msg: >-
      Under --check, a source without db_query must still be refused.
      rc={{ inventory_check_no_query.rc }}
    success_msg: Check mode kept the plugin's validation.

- name: Check-mode | Live inventory under --check
  when: inventory_service_available | bool
  block:
    - name: Check-mode | Write a source that selects the test rows
      ansible.builtin.copy:
        dest: "{{ inventory_workdir.path }}/check-live.mysql.yml"
        content: |
          ---
          plugin: silexdata.mysql.inventory
          db_query: {{ inventory_live_query | to_json }}
        mode: "0600"

    - name: Check-mode | List the inventory normally
      ansible.builtin.command:
        argv: [ansible-inventory, -i, "{{ inventory_workdir.path }}/check-live.mysql.yml", --list]
      environment: "{{ inventory_env | combine(inventory_live_env) }}"
      register: inventory_check_list
      changed_when: false
      no_log: true

    - name: Check-mode | Run the playbook in check mode against the same source
      ansible.builtin.command:
        argv: [ansible-playbook, --check, -i, "{{ inventory_workdir.path }}/check-live.mysql.yml", "{{ inventory_workdir.path }}/visit-hosts.yml"]
      environment: "{{ inventory_env | combine(inventory_live_env) }}"
      register: inventory_check_run
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check-mode | Assert check mode saw every host and changed nothing
      vars:
        inventory_check_hosts: "{{ (inventory_check_list.stdout | from_json)._meta.hostvars.keys() | list }}"
      ansible.builtin.assert:
        that:
          - inventory_check_run.rc == 0
          - inventory_check_hosts | length > 0
          - inventory_check_hosts | reject('in', inventory_check_run.stdout) | list | length == 0
          - inventory_check_run.stdout is not search('changed=[1-9]')
        fail_msg: >-
          ansible-playbook --check must see the same {{ inventory_check_hosts | length }} hosts
          as ansible-inventory and change nothing. rc={{ inventory_check_run.rc }}
        success_msg: Check mode saw the same inventory and made no changes.
