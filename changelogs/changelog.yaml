---
ancestor: null
releases:
  1.0.0:
    changes:
      minor_changes:
        - Added an inventory plugin for MySQL.
        - Set up the collection structure, licensing, and documentation.
      release_summary: 'Initial release of the silexdata.mysql Ansible Collection.

        '
    fragments:
      - 1.0.0.yml
    release_date: '2025-08-15'
  1.0.1:
    changes:
      minor_changes:
        - inventory - Added environment variable option for ``db_host``, ``db_port``,
          ``db_user``, ``db_password``, and ``db_name`` options.
    fragments:
      - 20250909-add-env-var-options.yml
    release_date: '2025-09-09'
  1.0.2:
    changes:
      bugfixes:
        - galaxy.yml - declare GPL-3.0-or-later, the license of the inventory plugin,
          alongside Apache-2.0. The collection declared only Apache-2.0 before.
        - inventory - document ``silexdata.mysql.inventory`` as the only accepted
          ``plugin`` value. The short name ``inventory`` was documented but always
          refused by Ansible.
        - inventory - report that the ``pymysql`` Python library is required when
          it is not installed, instead of failing to load the plugin.
        - inventory - store the refreshed inventory in the cache on ``--flush-cache``.
          It was re-read from the database but not cached, so the next cached run
          still served the old data.
    fragments:
      - adopt-shared-ci.yml
      - inventory-cache-and-plugin-name.yml
      - inventory-license.yml
      - inventory-sanity.yml
    release_date: '2026-11-10'
